plugins {
	id 'com.gradleup.shadow'
}

base {
	archivesName = mod_id
	version = getArchiveVersion("fabric")
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
	
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	// Mod Menu
	maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	common(project(':common')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
	
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "dev.architectury:architectury-fabric:${architectury_api_version}"
	
	// MixinExtras
	implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"))
	
	// My Inventory
	shadowBundle "com.github.Leawind:inventory-java:${leawinds_inventory_version}"
	implementation("com.github.Leawind:inventory-java:${leawinds_inventory_version}")
	
	// Cloth Config API
	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_api_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude module: 'modmenu'
	}
	// YACL
	implementation "dev.isxander:yet-another-config-lib:${yacl_mc_version}-fabric"
	// ModMenu
	implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

jar {
	archiveClassifier = "dev"
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = ""
	manifest {
		attributes "Fabric-Mapping-Namespace": "official"
	}

	relocate "io.github.leawind.inventory", "com.github.leawind.thirdperson.lib.inventory"
}

assemble.dependsOn shadowJar
